name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          echo "storePassword=android" > ~/.android/debug.keystore.properties
          echo "keyPassword=android" >> ~/.android/debug.keystore.properties
          echo "keyAlias=androiddebugkey" >> ~/.android/debug.keystore.properties
          echo "storeFile=~/.android/debug.keystore" >> ~/.android/debug.keystore.properties
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
  
     - name: Set up JDK 17
        uses: actions/setup-java@v5.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
        continue-on-error: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reuse-Geovane
          path: app/build/outputs/apk/debug/*.apk

# trigger build
